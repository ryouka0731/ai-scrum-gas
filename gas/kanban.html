<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --card-2: #fafbfc;
    --line: #e4e7eb; --ink: #1b1f24; --ink-2: #5b626b; --ink-3: #686d74;
    --accent: #2563eb; --accent-ink: #ffffff; --danger: #c0392b;
    --prio-Critical: #d93025; --prio-High: #e8710a;
    --prio-Medium: #1a73e8; --prio-Low: #7a838c;
    --shadow-1: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --shadow-2: 0 8px 24px rgba(16,24,40,.12), 0 2px 6px rgba(16,24,40,.06);
    --radius: 10px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131619; --card: #1b1f23; --card-2: #21262b;
      --line: #2b3137; --ink: #e6e9ec; --ink-2: #a3abb3; --ink-3: #858c95;
      --accent: #5b9bff; --accent-ink: #10141a; --danger: #ff6b5e;
      --prio-Critical: #ff6b5e; --prio-High: #ffa657;
      --prio-Medium: #79b8ff; --prio-Low: #99a1a9;
      --shadow-1: 0 1px 2px rgba(0,0,0,.5);
      --shadow-2: 0 10px 28px rgba(0,0,0,.6);
    }
  }
  /* 作成者オリジンの display 指定は UA スタイルシートの [hidden]{display:none} に
     常に優先するため、hidden 属性だけでは隠れない要素（#panel / #toast / button 等の
     display: flex 指定を持つもの）向けに明示しておく。 */
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: var(--sp-5); background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP",
                 "Yu Gothic UI", Meiryo, sans-serif;
    line-height: 1.7; letter-spacing: .01em;
  }
  header { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-4); }
  h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  .spacer { flex: 1; }
  button {
    font: inherit; line-height: 1.4; display: inline-flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3); border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
    border-radius: 8px; cursor: pointer;
  }
  button:hover { background: var(--card-2); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[disabled] { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--danger); }
  button.icon-only { padding: var(--sp-1); border-color: transparent; background: transparent; }
  button.add {
    width: 100%; justify-content: center; color: var(--ink-2);
    border-style: dashed; background: transparent;
  }
  button.add:hover { color: var(--accent); border-color: var(--accent); }

  #message { min-height: 22px; margin-bottom: var(--sp-3); font-size: 13px; white-space: pre-line; }
  #message.error { color: var(--danger); }
  #message.info { color: var(--ink-2); }

  /* 盤面とパネルを横に並べる。パネルは覆いかぶさらない（モードレス） */
  #main { display: flex; gap: var(--sp-4); align-items: flex-start; }
  #board { display: flex; gap: var(--sp-4); align-items: flex-start; flex: 1; min-width: 0; }
  .column { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-3); }
  .column > h2 {
    font-size: 12px; margin: 0; color: var(--ink-2);
    letter-spacing: .06em; display: flex; align-items: center; gap: var(--sp-2);
  }
  .count {
    font-weight: normal; color: var(--ink-3); background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; padding: 0 var(--sp-2); font-size: 11px;
  }
  .dropzone {
    border: 1px dashed transparent; border-radius: var(--radius);
    padding: var(--sp-1); min-height: 72px;
  }
  .dropzone.over { border-color: var(--accent); background: var(--card-2); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-1);
    padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-3);
    cursor: grab; font-size: 13px;
  }
  .card:hover { box-shadow: var(--shadow-2); }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .4; }
  .card.pending { opacity: .55; cursor: default; }
  .card.selected { border-color: var(--accent); box-shadow: var(--shadow-2); }
  .card .prio { display: flex; align-items: center; gap: var(--sp-2); font-size: 11px; color: var(--ink-2); }
  .card .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
  .card .title { margin: var(--sp-2) 0 var(--sp-3); color: var(--ink); overflow-wrap: anywhere; }
  .card .meta {
    color: var(--ink-3); font-size: 11px; display: flex; gap: var(--sp-3);
    border-top: 1px solid var(--line); padding-top: var(--sp-2);
  }
  .empty { color: var(--ink-3); font-size: 12px; padding: var(--sp-3) var(--sp-2); }

  /* 狭い画面では列を縦に積む。横スクロールは一覧性を下げ、タッチで扱いにくい */
  @media (max-width: 900px) {
    body { padding: var(--sp-3); }
    #main { flex-direction: column; }
    #board { flex-direction: column; width: 100%; }
    .column { width: 100%; }
    /* 縦積みの flex では交差軸（＝幅）が align-items: flex-start で中身なりに決まるため、
       幅を指定しないと #table-view が表の幅まで広がり、ページごと横に伸びる
       （375px の端末で 616px まで広がる実測がある）。親の幅で止めて、表は
       .table-wrap の overflow-x で枠の中を横スクロールさせる。#board / #panel と同じ手。 */
    #table-view { width: 100%; }
  }

  #panel {
    flex: 0 0 380px; align-self: stretch;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-1); padding: var(--sp-4);
    display: flex; flex-direction: column; gap: var(--sp-3);
  }
  #panel h2 { font-size: 15px; margin: 0; }
  .panel-head { display: flex; align-items: center; gap: var(--sp-3); }
  .field { display: flex; flex-direction: column; gap: var(--sp-2); }
  .field label { font-size: 12px; color: var(--ink-2); }
  .field input, .field textarea, .field select {
    font: inherit; line-height: 1.7; color: var(--ink); background: var(--card-2);
    border: 1px solid var(--line); border-radius: 8px; padding: var(--sp-2) var(--sp-3);
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent;
  }
  .field textarea { min-height: 76px; resize: vertical; }
  .field .hint { font-size: 11px; color: var(--ink-3); }
  .row { display: flex; gap: var(--sp-3); }
  .row > .field { flex: 1; min-width: 0; }
  .panel-foot { display: flex; gap: var(--sp-3); align-items: center; margin-top: auto; padding-top: var(--sp-3); }
  .panel-foot .spacer { flex: 1; }
  #panel-message { font-size: 12px; min-height: 18px; white-space: pre-line; }
  #panel-message.error { color: var(--danger); }
  @media (max-width: 900px) {
    #panel { flex: 1 1 auto; width: 100%; }
  }

  #toast {
    position: fixed; left: 50%; bottom: var(--sp-5); transform: translateX(-50%);
    display: flex; align-items: center; gap: var(--sp-4);
    background: var(--ink); color: var(--bg);
    border-radius: var(--radius); box-shadow: var(--shadow-2);
    padding: var(--sp-3) var(--sp-4); font-size: 13px; max-width: min(560px, 92vw);
    /* 今は DOM 順で最前面になっているだけ。あとで position を持つ要素が
       足されると黙って隠れてしまうため、明示しておく。 */
    z-index: 10;
  }
  #toast button {
    background: transparent; border-color: transparent; color: var(--bg);
    text-decoration: underline; padding: var(--sp-1) var(--sp-2);
  }
  #toast button:hover { background: rgba(255,255,255,.12); }
  /* 狭い画面では #panel が全幅で縦に積まれ、下端の入力欄・保存ボタンが画面下部に来る。
     通知を bottom に置いたままだと、消えるまでの10秒間それらを覆ってしまう。
     #toast 本体の規則より後ろに置き、bottom を確実に上書きする（同じ詳細度なので
     ソース順が先の規則は負ける）。 */
  @media (max-width: 900px) {
    #toast { top: var(--sp-3); bottom: auto; }
  }

  .tabs { display: flex; gap: var(--sp-1); border-bottom: 1px solid var(--line); }
  .tabs button {
    border: none; border-bottom: 2px solid transparent; border-radius: 0;
    background: transparent; color: var(--ink-2); padding: var(--sp-2) var(--sp-3);
  }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .views { display: flex; gap: var(--sp-1); margin: var(--sp-3) 0; }
  .views button { font-size: 12px; padding: var(--sp-1) var(--sp-3); }
  .views button[aria-selected="true"] { background: var(--card-2); border-color: var(--accent); }
  #summary {
    font-size: 12px; color: var(--ink-2); padding: var(--sp-3) 0;
    display: flex; gap: var(--sp-4); flex-wrap: wrap;
  }
  /* スプリントゴールは文章。数値の統計と同じ並びに埋めると読み飛ばされるため、
     行を分け（flex-basis: 100%）、本文と同じ濃さにする。長文でも横スクロールを
     出さない（.card .title と同じ overflow-wrap）。 */
  #summary .goal { flex-basis: 100%; color: var(--ink); overflow-wrap: anywhere; }

  /* 用語の補足。モーダルにしない（開いている間も盤面を操作できる）。 */
  /* 本文は position: fixed（下記）なので、ここに position は要らない。置くと
     「本文はこの中に収まる」と読めてしまうため、あえて持たせない。 */
  .help { display: inline-flex; }
  /* 見た目の ? は 11px のままでよいが、当たり判定は 24×24 以上にする（WCAG 2.5.8）。
     指で当てられない補足は、タッチ端末では無いのと同じ。負のブロックマージンで
     広げた分を打ち消し、列の見出し・カード・表の行の高さを変えない。 */
  .help > button {
    border: none; background: transparent; color: var(--ink-2);
    padding: 0 var(--sp-1); font-size: 11px; line-height: 1;
    min-width: 24px; min-height: 24px; justify-content: center;
    margin-top: -6px; margin-bottom: -6px;
  }
  .help > button:hover, .help > button:focus-visible { color: var(--accent); }
  /* position: fixed。absolute だと、overflow を持つ祖先（#table-view。.table-wrap の
     overflow-x: auto は overflow-y: visible を auto に格上げするので両軸のクリップ箱に
     なる）に切り取られ、表のヘッダーの補足が枠で切れる（実測で 17px 欠けていた）。
     fixed は overflow では切られないので枠から逃げられる。位置は open() が
     getBoundingClientRect() から入れる（top / left をここに書かないのはそのため）。
     white-space は th の nowrap を継承するため、必ずここで戻す — 戻さないと
     50 字前後の本文が1行に潰れて 280px の枠を突き抜ける（切り取りとは別の不具合）。 */
  .help-body {
    position: fixed; z-index: 20;
    width: max-content; max-width: min(280px, 80vw);
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    box-shadow: var(--shadow-2); padding: var(--sp-3);
    font-size: 12px; line-height: 1.7; font-weight: normal; text-align: left;
    white-space: normal;
  }

  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td {
    border-bottom: 1px solid var(--line); padding: var(--sp-2) var(--sp-3);
    text-align: left; vertical-align: top;
  }
  th { color: var(--ink-2); font-weight: normal; white-space: nowrap; }
  td { overflow-wrap: anywhere; }
  td.mark { background: var(--accent); color: var(--accent-ink); }
  .table-empty { color: var(--ink-2); font-size: 12px; padding: var(--sp-4) 0; }
</style>
</head>
<body>
<header>
  <h1>AI Scrum ボード</h1>
  <span class="spacer"></span>
  <button id="reload" type="button"></button>
</header>
<div id="message" class="info">読み込んでいます…</div>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="views" id="views" role="tablist"></div>
<div id="summary"></div>
<div id="main">
  <div id="board"></div>
  <div id="table-view" class="table-wrap" hidden></div>
  <aside id="panel" hidden aria-label="PBI の詳細">
    <div class="panel-head">
      <h2 id="panel-title">PBI</h2>
      <span class="spacer"></span>
      <button id="panel-close" class="icon-only" type="button" aria-label="閉じる"></button>
    </div>
    <div class="field">
      <label for="f-title">タイトル</label>
      <input id="f-title" type="text">
    </div>
    <div class="field">
      <label for="f-description">説明</label>
      <textarea id="f-description"></textarea>
    </div>
    <div class="field">
      <label for="f-acceptance">受入基準</label>
      <textarea id="f-acceptance"></textarea>
      <!-- パネルの入力欄は補足を押させず .hint で常に見せる（余白があるため）。
           文面は用語集から入れる（glossaryOf('受入基準')。ここに直接書くと源泉が2つになる）。 -->
      <span id="f-acceptance-hint" class="hint"></span>
    </div>
    <div class="row">
      <div class="field">
        <label for="f-status">ステータス</label>
        <select id="f-status"></select>
      </div>
      <div class="field">
        <label for="f-priority">優先度</label>
        <select id="f-priority"></select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <!-- 入力欄の id と CSV の列名は size のまま（列名は変えない）。 -->
        <label for="f-size">ポイント</label>
        <input id="f-size" type="text" inputmode="numeric">
        <!-- 文面は用語集から入れる（glossaryOf('ポイント')）。直書きすると、同じ語の
             説明が用語集と画面で2通りになる。 -->
        <span id="f-size-hint" class="hint"></span>
      </div>
      <div class="field">
        <label for="f-sprint">スプリント</label>
        <!-- 自由入力だと打ち間違いが幽霊スプリントを作り、velocity.csv に無い名前を
             書くとその PBI はロードマップから黙って消える。velocity.csv から選ばせる。 -->
        <select id="f-sprint"></select>
      </div>
    </div>
    <div id="panel-message" class="info"></div>
    <div class="panel-foot">
      <button id="panel-save" class="primary" type="button"></button>
      <span class="spacer"></span>
      <button id="panel-delete" class="danger" type="button"></button>
    </div>
  </aside>
</div>
<div id="toast" hidden role="status">
  <span id="toast-text"></span>
  <span class="spacer"></span>
  <button id="toast-undo" type="button"></button>
</div>

<script>
var SVG_NS = 'http://www.w3.org/2000/svg';
var ICON_PATHS = {
  plus:   ['M8 3.2v9.6', 'M3.2 8h9.6'],
  save:   ['M3 3.8A.8.8 0 0 1 3.8 3H10l3 3v6.2a.8.8 0 0 1-.8.8H3.8a.8.8 0 0 1-.8-.8Z',
           'M5.5 3v3.2h4.2V3', 'M5.5 13V9.6h5V13'],
  trash:  ['M2.8 4.4h10.4', 'M6.4 4.4V2.9h3.2v1.5', 'M4.2 4.4 4.8 13.2h6.4l.6-8.8'],
  close:  ['M4 4l8 8', 'M12 4l-8 8'],
  reload: ['M13 8a5 5 0 1 1-1.7-3.75', 'M13.2 2v3.1h-3.1'],
  undo:   ['M3.2 7.2h7a3 3 0 0 1 0 6H7', 'M6 4.4 3.2 7.2 6 10']
};

/** 16px のインライン SVG アイコンを作る。色は文字色に追従する。 */
function makeIcon(name) {
  var svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 16 16');
  svg.setAttribute('width', '16');
  svg.setAttribute('height', '16');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.4');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  // 意味はラベル側が持つ。読み上げで二重にしない。
  svg.setAttribute('aria-hidden', 'true');
  (ICON_PATHS[name] || []).forEach(function (d) {
    var p = document.createElementNS(SVG_NS, 'path');
    p.setAttribute('d', d);
    svg.appendChild(p);
  });
  return svg;
}

/** アイコンとラベルを持つボタンの中身を作る。 */
function fillButton(btn, iconName, label) {
  btn.appendChild(makeIcon(iconName));
  var span = document.createElement('span');
  span.textContent = label;
  btn.appendChild(span);
}

/**
 * 用語と説明。gas/pure_glossary.js の写し。
 *
 * GAS のサーバ側 .js はブラウザからは呼べない（google.script.run は非同期で、
 * 描画の途中では待てない）ため、画面に出す文面はここに持つしかない。写しが黙って
 * ずれないよう、gas/tests/kanban_glossary.test.js が pure_glossary.js との一致を
 * 固定している。文面を直すときは pure_glossary.js と両方を直すこと。
 */
var GLOSSARY = {
  'ストーリーポイント':
    'その項目1つの相対的な大きさ。時間ではない。ベロシティは、完了したストーリーポイントの合計。',
  'ベロシティ':
    'チームが1スプリントで完了できたストーリーポイントの合計。次のスプリントで積める量の目安になる。',
  'バーンダウン':
    'スプリントの残り作業が日を追ってどう減ったかの記録。線が下がりきればスプリントの目標に届く。',
  'ロードマップ':
    'どのやることを、どのスプリントで扱う予定かの一覧。帯の位置が期間を表す。',
  'スプリント':
    '区切られた作業期間。この単位で計画し、終わりに成果を確かめる。',
  '障害物':
    'チームの進みを妨げているもの。気づいた人が書き出し、取り除けたら解決済みにする。',
  '受入基準':
    'そのやることが「終わった」と言える条件。セミコロン（;）で区切って複数書く。',
  'New': 'まだ着手していない段階。',
  'Ready': '着手できる状態まで内容が定まった段階。',
  'In Progress': '誰かが手をつけている段階。',
  'Review': '受入基準を満たしたかを確かめている段階。',
  'Done': '受入基準を満たし、完了と認められた段階。',
  'Critical': '最優先。これが止まると他が進まない。',
  'High': '最優先ではないが、早く着手すべきもの。',
  'Medium': '通常の優先度。急がないが、順番が来たら着手する。',
  'Low': '手が空いたときに扱うもの。'
};

/**
 * 画面の見出し語 → 用語集のキー。gas/pure_glossary.js の写し。
 *
 * 一覧の列見出しは「ポイント」、用語集のキーは「ストーリーポイント」。label は UI の
 * 文言なので変わりうるため、突き合わせを label そのものに縛らない。
 */
var GLOSSARY_ALIASES = {
  'ポイント': 'ストーリーポイント'
};

/** 用語の説明を返す。別名も解決する。知らない語なら空文字。 */
function glossaryOf(term) {
  var key = String(term === null || term === undefined ? '' : term).trim();
  if (!key) return '';
  if (Object.prototype.hasOwnProperty.call(GLOSSARY_ALIASES, key)) key = GLOSSARY_ALIASES[key];
  return Object.prototype.hasOwnProperty.call(GLOSSARY, key) ? GLOSSARY[key] : '';
}

// 今開いている補足を閉じる関数。補足は同時に1つだけ開く（別の補足が開いたら前を閉じる）。
// Escape はここを最初に見る（一番手前にあるものから閉じるため）。
var openHelp = null;

/** 開いている補足があれば閉じて true を返す。無ければ false。 */
function closeOpenHelp() {
  if (!openHelp) return false;
  var close = openHelp;
  close();
  return true;
}

/**
 * 補足を含みうる領域（#board / #table-view / #summary）の中身を空にする。
 *
 * 空にする前に、開いている補足を閉じる。
 * - 記録（openHelp）だけ残ると、Escape が「もう画面に無い補足」を閉じたことにして、
 *   その一打が通知やパネルまで届かない。
 * - 閉じずに記録だけ捨てると、消えない領域（盤面へ切り替えたあとの #table-view は
 *   hidden になるだけで中身が残る）に開いたままの補足が置き去りになる。
 */
function clearHost(el) {
  closeOpenHelp();
  el.innerHTML = '';
}

// 補足の本文と画面の端との余白。position: fixed で自分で位置を決めるので、
// 画面外へはみ出さないようここで詰める。
var HELP_MARGIN = 8;

// 本文に振る id の通し番号。aria-describedby で ? ボタンと紐付けるために要る。
var helpSeq = 0;

/**
 * 補足の本文を画面内に収める位置（viewport 座標）を返す。
 *
 * position: fixed なので、基準は ? ボタンの画面上の位置。右や下がはみ出すときは
 * 内側へ寄せる（右端の列の補足が画面の外に出ると、そもそも読めない）。
 */
function helpBodyPosition(btnRect, bodyRect, viewWidth, viewHeight) {
  var left = btnRect.left;
  var maxLeft = viewWidth - bodyRect.width - HELP_MARGIN;
  if (left > maxLeft) left = maxLeft;
  if (left < HELP_MARGIN) left = HELP_MARGIN;

  var top = btnRect.bottom + HELP_MARGIN;
  if (top + bodyRect.height > viewHeight - HELP_MARGIN) {
    // 下に入らなければ上に出す。上にも入らなければ上端に貼る。
    top = btnRect.top - bodyRect.height - HELP_MARGIN;
    if (top < HELP_MARGIN) top = HELP_MARGIN;
  }
  return { left: left, top: top };
}

/**
 * 用語の補足。押しても、カーソルを当てても、キーボードでも開く。
 * 第2段階でタッチ端末に対応したので、カーソルだけに頼る形は採らない。
 * モーダルにしない（開いている間も盤面は操作できる）。
 *
 * 用語集に無い語では**何も作らない**（null を返す）。空の要素を置くと、当たり判定を
 * 広げた分だけ幽霊の隙間が出る（一覧のヘッダーは6列が用語集に無い）。
 */
function makeHelp(term) {
  var text = glossaryOf(term);
  if (!text) return null;

  var wrap = document.createElement('span');
  wrap.className = 'help';

  var btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = '?';
  btn.setAttribute('aria-label', term + 'とは');
  btn.setAttribute('aria-expanded', 'false');

  // 本文は span。列の見出し（h2）の中にも置くため、div だと content model 違反になる。
  // position: fixed は display を block 化するので、span でも箱として振る舞う。
  var body = document.createElement('span');
  body.className = 'help-body';
  body.textContent = text;
  body.hidden = true;
  helpSeq++;
  body.id = 'help-body-' + helpSeq;
  // フォーカスしただけで本文が読み上げられるようにする（aria-expanded だけだと、
  // 開いたことは伝わっても中身が届かない。blur で閉じるので中へ入る手段も無い）。
  btn.setAttribute('aria-describedby', body.id);

  var close = function () {
    body.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    if (openHelp === close) openHelp = null;
  };
  var open = function () {
    // 同時に2つ開かない。描き直しで消えた補足を openHelp が掴んだままにもしない。
    if (openHelp && openHelp !== close) openHelp();
    body.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    // 位置は開くたびに計算する。表は横スクロールし、盤面は縦に伸びるので、
    // 作った時点の位置は当てにならない。表示してから測る（隠れた要素は測れない）。
    // 収め先は documentElement の clientWidth / clientHeight。window.innerWidth は
    // 端末によって「実際に見えている幅」と違う（375px の端末で 628 を返す実測がある。
    // ページ自体が横に伸びると innerWidth はそちらに付いてくる）。その値を信じると、
    // 収めたはずの補足が画面の外に出る。clientWidth はスクロールバーの幅も含まない。
    var root = document.documentElement;
    var pos = helpBodyPosition(
      btn.getBoundingClientRect(), body.getBoundingClientRect(),
      root.clientWidth, root.clientHeight
    );
    body.style.left = pos.left + 'px';
    body.style.top = pos.top + 'px';
    openHelp = close;
  };

  // 押したときの開閉は「押し始めた時点」の状態で決める。
  //
  // クリックは focus を伴い、タッチ端末でも合成の mouseenter を伴う。それらが先に
  // 開いてしまうため、click の時点で「今開いているから閉じる」と判断すると、
  // タッチでは押しても開かない（開いた直後に閉じる）ことになる。pointerdown は
  // マウスでは mouseenter の後、タッチでは合成イベントより前に来るので、
  // ここで控えた状態を使えばどちらでも意図どおりになる
  // （マウス: 触れて開く → 押して閉じる、タッチ: 押して開く → もう一度押して閉じる）。
  // pointerdown が来ない環境（古い Safari・キーボード操作）では今の状態で判定する。
  var hiddenAtPress = null;
  btn.addEventListener('pointerdown', function () { hiddenAtPress = body.hidden; });
  btn.addEventListener('click', function (ev) {
    // 補足は「どこに置かれても同じように振る舞う部品」にする。ここで止めないと、
    // カードの中に置いた ? の click が .card まで上がり、そのカードの編集パネルが
    // 開いてしまう（openPanel → render(board) で盤面ごと描き直され、たった今開いた
    // 補足は要素ごと捨てられる）。押しても補足が出ず、代わりに関係のないパネルが
    // 開くうえ、カーソルの無いタッチ端末ではカードの補足に到達する手が無くなる。
    // 置かれた先の親に気を配らせる形にすると、次に別の場所へ置いた人が同じ穴を開ける。
    ev.stopPropagation();
    var wasHidden = (hiddenAtPress === null) ? body.hidden : hiddenAtPress;
    hiddenAtPress = null;
    if (wasHidden) open(); else close();
  });
  btn.addEventListener('mouseenter', open);
  wrap.addEventListener('mouseleave', close);
  btn.addEventListener('focus', open);
  btn.addEventListener('blur', close);

  wrap.appendChild(btn);
  wrap.appendChild(body);
  return wrap;
}

/** 用語の補足を parent に足す。用語集に無い語では何も足さない。 */
function appendHelp(parent, term) {
  var help = makeHelp(term);
  if (help) parent.appendChild(help);
}

var dragging = null;
// 現在描画している board。楽観的更新の基準（元の位置へ戻す先）として保持する。
var board = null;
// サーバへ送信中のカード id。応答が返るまで再ドラッグさせない（見た目専用）。
var pendingIds = {};
// 送信中の要求の総数。同じカードへのドラッグと保存が重なると pendingIds は
// 同じキー（そのカードの id）を指すため、重なりの判定には使えない。
// 「送信が何件重なっているか」は pendingIds とは別にこちらで数える。
var inflight = 0;
// 送信が重なった batch かどうか。重なっていた間の応答は board 全体を信じない。
var overlapped = false;
// 書き込み（ドラッグ・保存・作成・削除・取り消し）が確定するたびに増える通し番号。
// apiGetView はロックを取らないため、書き込み中の古い CSV を読める。loadView() の応答が
// 「発行してから届くまでの間に確定した書き込み」を含まない古い board であることを、
// inflight（応答時点で送信中の要求が無いか）だけでは見分けられない。loadView() を出した
// 時点の値を控えておき、応答時に比べる。
var writeSeq = 0;

function setMessage(text, kind) {
  var el = document.getElementById('message');
  el.textContent = text;
  el.className = kind || 'info';
}

/**
 * closePanel() / openPanel() は「選択中のカードに印を付け直す」ために render(board) を
 * 呼ぶ。初回の apiGetView('board') の応答が届く前（board がまだ null）にタブ／ビューを
 * 押すと、その経路をここで踏む。b.columns を無条件に読むと TypeError になり、
 * switchTab() 側は既に activeTab / activeView を書き換えたあとでその例外を受けるため、
 * renderTabs() / showView() / loadView() が実行されないまま止まる — タブの表示と
 * 内部状態が永続的に食い違う（この画面が繰り返し踏んでいるのと同型の不具合）。
 * ここで無視すれば、呼び出し元は例外を受けずに最後まで進む。openPanel() 側の
 * render(board) も同じ理由で守られる。
 */
function render(b) {
  if (!b) return;
  board = b;
  var root = document.getElementById('board');
  clearHost(root);
  b.columns.forEach(function (col) { root.appendChild(renderColumn(col)); });
}

function renderColumn(col) {
  var div = document.createElement('div');
  div.className = 'column';
  div.dataset.status = col.status;

  var h = document.createElement('h2');
  var name = document.createElement('span');
  name.textContent = col.status;
  h.appendChild(name);
  appendHelp(h, col.status);   // ステータス名の補足
  var count = document.createElement('span');
  count.className = 'count';
  count.textContent = String(col.cards.length);
  h.appendChild(count);
  div.appendChild(h);

  var zone = document.createElement('div');
  zone.className = 'dropzone';
  zone.dataset.status = col.status;
  if (col.cards.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'なし';
    zone.appendChild(empty);
  }
  col.cards.forEach(function (card) { zone.appendChild(renderCard(card)); });
  // ドロップ枠の付け外しはこの要素で行う（列見出しにはかけない）
  wireDropzone(zone, col.status);
  div.appendChild(zone);

  var add = document.createElement('button');
  add.className = 'add';
  add.type = 'button';
  fillButton(add, 'plus', '追加');
  add.addEventListener('click', function () { onAddClick(col.status); });
  div.appendChild(add);
  return div;
}

function onAddClick(status) {
  // 盤面タブを見ていないのに開かせない（move() と同じ規則: 盤面由来の操作は、
  // 盤面が隠れているとき起こらない）。#board は hidden で隠れていても DOM からは
  // 消えていないため、この防御が無いと隠れた盤面の「追加」ボタンから書き込みが飛ぶ。
  if (activeView !== 'board') return;
  openPanel(null, status);
}

/**
 * ドロップ枠の dragover / dragleave / drop を配線する。現行の render() にあった
 * 処理をそのまま移したもの（意味は変えていない）。
 */
function wireDropzone(zone, status) {
  zone.addEventListener('dragover', function (ev) {
    ev.preventDefault();
    zone.classList.add('over');
  });
  zone.addEventListener('dragleave', function () { zone.classList.remove('over'); });
  zone.addEventListener('drop', function (ev) {
    ev.preventDefault();
    zone.classList.remove('over');
    if (dragging && dragging.status !== status && !pendingIds[dragging.id]) {
      move(dragging.id, status);
    }
  });
}

function renderCard(card) {
  var el = document.createElement('div');
  el.className = 'card' + (pendingIds[card.id] ? ' pending' : '')
    + (panelState.id === card.id ? ' selected' : '');
  el.draggable = !pendingIds[card.id];
  el.dataset.id = card.id;

  var prio = document.createElement('div');
  prio.className = 'prio';
  var dot = document.createElement('span');
  dot.className = 'dot';
  if (card.priority) dot.style.background = 'var(--prio-' + card.priority + ')';
  prio.appendChild(dot);
  var prioText = document.createElement('span');
  prioText.textContent = card.priority || '未設定';
  prio.appendChild(prioText);
  appendHelp(prio, card.priority);   // 優先度の補足（未設定なら何も出ない）
  var idText = document.createElement('span');
  idText.style.marginLeft = 'auto';
  idText.textContent = card.id;
  prio.appendChild(idText);
  el.appendChild(prio);

  var title = document.createElement('div');
  title.className = 'title';
  title.textContent = card.title;
  el.appendChild(title);

  var meta = document.createElement('div');
  meta.className = 'meta';
  [card.size ? card.size + ' pt' : '', card.sprint || '', card.updated_at || '']
    .filter(function (t) { return t; })
    .forEach(function (t) {
      var s = document.createElement('span');
      s.textContent = t;
      meta.appendChild(s);
    });
  el.appendChild(meta);

  el.addEventListener('dragstart', function (ev) {
    if (pendingIds[card.id]) { ev.preventDefault(); return; }
    dragging = {
      id: card.id,
      status: el.parentNode.dataset.status,
      updatedAt: card.updated_at
    };
    // Firefox は dragstart で dataTransfer にデータをセットしないと
    // ドラッグ操作自体を開始しない（Chrome / Edge / Safari は不要でも動く）。
    // 実際の値は dragging（クロージャ）で保持するため、ここでは形式的にセットするだけでよい。
    ev.dataTransfer.setData('text/plain', card.id);
    el.classList.add('dragging');
  });
  el.addEventListener('dragend', function () {
    dragging = null;
    el.classList.remove('dragging');
  });
  el.addEventListener('click', function () {
    if (pendingIds[card.id]) return;
    // 盤面タブを見ていないのに開かせない（move() と同じ規則）。
    if (activeView !== 'board') return;
    openPanel(card.id, null);
  });
  return el;
}

/** board の中から id のカードを探す。見つからなければ null。 */
function findCard(b, id) {
  for (var i = 0; i < b.columns.length; i++) {
    var cards = b.columns[i].cards;
    for (var j = 0; j < cards.length; j++) {
      if (cards[j].id === id) return cards[j];
    }
  }
  return null;
}

/** id のカードが今どの列にいるかを返す。見つからなければ null。 */
function columnStatusOf(b, id) {
  for (var i = 0; i < b.columns.length; i++) {
    var cards = b.columns[i].cards;
    for (var j = 0; j < cards.length; j++) {
      if (cards[j].id === id) return b.columns[i].status;
    }
  }
  return null;
}

/** board を複製し、id のカードを取り除いた新しい board を返す（元の board は変えない）。 */
function boardWithCardRemoved(b, id) {
  return {
    columns: b.columns.map(function (col) {
      return { status: col.status, cards: col.cards.filter(function (c) { return c.id !== id; }) };
    })
  };
}

/** board を複製し、card を status の列に置いた新しい board を返す（同じ id が居れば置き換える）。 */
function boardWithCardUpserted(b, card, status) {
  var removed = boardWithCardRemoved(b, card.id);
  var next = { columns: removed.columns.map(function (col) {
    return { status: col.status, cards: col.cards.slice() };
  }) };
  for (var i = 0; i < next.columns.length; i++) {
    if (next.columns[i].status === status) { next.columns[i].cards.push(card); return next; }
  }
  // 行き先の列が無い（未知のステータス）ときは、消したままにせず元に戻す。
  return b;
}

/**
 * 応答が運ぶ board から、そのカード1枚だけを今の画面へ反映する。
 *
 * 応答の board は「サーバがその要求を処理した時点」のもので、後から確定した
 * 別カードの移動を含まない。到達順は保証されないため、全体を信じると
 * 取り消したはずの移動が復活する。変わったのは常にこの1枚だけである。
 */
function mergeOneCard(current, serverBoard, id) {
  var to = columnStatusOf(serverBoard, id);
  var card = findCard(serverBoard, id);
  if (to === null || !card) return boardWithCardRemoved(current, id);
  return boardWithCardUpserted(current, card, to);
}

/** board を複製し、id のカードを newStatus の列へ移した新しい board を返す（元の board は変えない）。 */
function boardWithCardMoved(b, id, newStatus) {
  var next = { columns: b.columns.map(function (col) { return { status: col.status, cards: col.cards.slice() }; }) };
  // 移動先の列を先に確かめる。カードを抜いてから行き先が無いと分かると、
  // そのカードは画面から消えてしまう。
  var hasTarget = false;
  for (var t = 0; t < next.columns.length; t++) {
    if (next.columns[t].status === newStatus) { hasTarget = true; break; }
  }
  if (!hasTarget) return next;
  var moving = null;
  for (var i = 0; i < next.columns.length; i++) {
    var cards = next.columns[i].cards;
    for (var j = 0; j < cards.length; j++) {
      if (cards[j].id === id) { moving = cards[j]; cards.splice(j, 1); break; }
    }
    if (moving) break;
  }
  if (!moving) return next;
  for (var k = 0; k < next.columns.length; k++) {
    if (next.columns[k].status === newStatus) { next.columns[k].cards.push(moving); break; }
  }
  return next;
}

/**
 * この応答が board 全体を信じてよいかを返し、送信中が無くなったら重なりを解除する。
 * 最後に届く応答の時点では他の pending は既に消えているため、送信時ではなく
 * 応答時にフラグを読む必要がある。
 */
function settleOverlap() {
  var trustWholeBoard = !overlapped;
  if (inflight === 0) overlapped = false;
  return trustWholeBoard;
}

/**
 * 応答が運ぶ board は「サーバがその要求を処理した時点」のもので、後から
 * commit された別カードの移動を含まない。応答の到達順は保証されないため、
 * 送信が重なった batch では board 全体を信じず、このカードの位置だけ取り込む。
 *
 * 取り込むカードは必ず serverBoard 側（サーバが進めた updated_at を持つ）の
 * ものを使う。今の board（画面上の、まだ古い updated_at のカード）を動かすと、
 * 見た目上は正しい列に映るのに updated_at だけ古いままになり、そのカードを
 * 開いて保存すると必ず一度 conflict する。mergeOneCard と同じ取り込み方にする。
 */
function applyServerBoard(serverBoard, id, trustWholeBoard) {
  if (trustWholeBoard) return serverBoard;
  return mergeOneCard(board, serverBoard, id);
}

/**
 * 楽観的に動かした位置に今もカードが居るときだけ元の列へ戻す。
 * 応答を待つ間に別の応答がこのカードを動かしていたら、そちらが新しい。
 */
function rollbackCard(id, newStatus, originalStatus) {
  if (columnStatusOf(board, id) !== newStatus) return board;
  return boardWithCardMoved(board, id, originalStatus);
}

var STATUS_OPTIONS = ['New', 'Ready', 'In Progress', 'Review', 'Done'];
var PRIORITY_OPTIONS = ['Critical', 'High', 'Medium', 'Low'];

// タブは対象の名前。ビューはその対象の見え方。
var TABS = [
  { id: 'pbi', label: 'やること', views: [
    { id: 'board', label: '盤面' },
    { id: 'list', label: '一覧' },
    { id: 'done', label: '完了' },
  ] },
  { id: 'sprint', label: 'スプリント', views: [
    { id: 'burndown', label: 'バーンダウン' },
    { id: 'velocity', label: 'ベロシティ' },
    { id: 'roadmap', label: 'ロードマップ' },
  ] },
  { id: 'impediment', label: '障害物', views: [
    { id: 'impediment', label: '一覧' },
  ] },
];

var activeTab = 'pbi';
var activeView = 'board';

// 「今この読み込みは、発行したときに選ばれていたビューのものか」を判定するための
// 通し番号（panelSeq と同じ考え方）。名前の比較（旧 requestedView !== activeView）だと、
// 同じビューへの2つの読み込みが逆順に届いたとき古い方が勝ってしまうのを防げない。
var viewSeq = 0;

// #table-view に showTableLoading() の「読み込んでいます…」placeholder が今も
// 出ているか。foldTableLoading() はこれが true のときだけ畳む — false（renderTable()
// が実データの表を描いた後）で畳むと、「最新にする」（showView() を経由しない）が
// 失敗したときに描画済みの表を消してしまう。DOM の中身を文字列で照合しない
// （表示文言を変えたときに黙って壊れるのを避ける）。
var tableLoading = false;

// パネルのスプリント欄の選択肢 [{value, label, unknown}]。盤面のビューの応答が
// 完成した形で運んでくる（パネルを開くたびにサーバへ往復させない）。組み立ての規則を
// ここに写すと、サーバ側だけを直したときに黙ってずれる（velocity.csv の日付判定を
// 緩めると、ロードマップには出るのに選択肢には出ないスプリントが生まれる等）。
// 載っていない応答（一覧・ロードマップ等）で消さないよう、届いたときだけ入れ替える。
var sprintChoices = [];

// id が null なら新規作成モード。status は新規作成時の初期ステータス。
// fields は writeForm() が入れた直後のフォームの内容（差分送信の基準）。
var panelState = { id: null, expectedUpdatedAt: '', status: STATUS_OPTIONS[0], fields: null };

// 「今このパネルは、その要求を出したときと同じものか」を判定するための通し番号。
// panelState.id では、作成中に別の列の「追加」を押された場合を区別できない（どちらも null）。
var panelSeq = 0;

function fillSelect(el, values) {
  el.innerHTML = '';
  values.forEach(function (v) {
    var o = document.createElement('option');
    o.value = v;
    o.textContent = v;
    el.appendChild(o);
  });
}

function setPanelMessage(text, kind) {
  var el = document.getElementById('panel-message');
  el.textContent = text;
  el.className = kind || 'info';
}

function readForm() {
  return {
    title: document.getElementById('f-title').value,
    description: document.getElementById('f-description').value,
    acceptance_criteria: document.getElementById('f-acceptance').value,
    status: document.getElementById('f-status').value,
    priority: document.getElementById('f-priority').value,
    size: document.getElementById('f-size').value,
    sprint: document.getElementById('f-sprint').value
  };
}

/**
 * 編集でサーバへ送る項目を作る。触っていない項目は送らない。
 *
 * CSV はローカルの Claude Code と共同所有しているため、パネルが表示できない値
 * （priority が空、status が語彙外、size が '2.5' 等）を常に送り返すと、
 * 触っていない項目が黙って書き換わるか、検証に引っかかって保存そのものが
 * 塞がれる。validatePbiFields は指定されなかった項目を検証しない。
 *
 * ただし title だけは、指定されなくても必須として検査される（空タイトルの行を
 * 作らせないため）。外すと何も直せなくなるので常に送る。
 */
function changedFields(initial) {
  var now = readForm();
  var out = { title: now.title };
  Object.keys(now).forEach(function (k) {
    if (!initial || now[k] !== initial[k]) out[k] = now[k];
  });
  return out;
}

/**
 * スプリントの選択肢を並べ直す。中身はサーバが完成させたものをそのまま出す。
 *
 * 値を入れる前に必ず呼ぶこと。select は選択肢に無い値を受け付けない（代入しても
 * 空になる）ため、順序を逆にすると既存のスプリントが黙って消える。
 *
 * 今の値が選択肢に無いときだけ、その値の選択肢を1つ足す。盤面を読み込んだ後に
 * 別の書き手が付けたスプリントは、サーバが返した選択肢にまだ入っていない。足さないと
 * パネルが「（未割り当て）」と表示し、利用者はそれを信じて選び直してしまう
 * （値が黙って消えるのではなく、誤った表示を信じて自分で上書きさせる形になる）。
 *
 * 足すのは**この所属判定だけ**。velocity.csv の絞り込み・日付の判定・並び順・重複排除は
 * サーバに置いたままにする（そちらを画面へ写すと、サーバ側だけを直したときに黙ってずれ、
 * ロードマップには出るのに選択肢には出ないスプリントのような食い違いが生まれる）。
 *
 * ラベルに「velocity.csv に無い」とは書かない。読み込み後に足されたスプリントは
 * velocity.csv に**ある**かもしれず、その表示は嘘になる。サーバが付ける
 * 「（velocity.csv に無い）」は「ロードマップに出ない」というデータの質の恒常的な情報、
 * こちらは「この画面がまだ知らない。読み込み直せば分かる」という一時的な状態で、
 * 意味が違う。同じ文言に揃えるとこの違いが潰れる。
 */
function fillSprintSelect(value) {
  var el = document.getElementById('f-sprint');
  el.innerHTML = '';
  var add = function (v, label) {
    var opt = document.createElement('option');
    opt.value = v;
    opt.textContent = label;
    el.appendChild(opt);
  };

  // value は trim 済みで渡ってくる（揃えるのは writeForm の1か所だけにする。
  // ここでも trim すると、どちらが効いているのか分からない行が増える）。
  var listed = false;
  sprintChoices.forEach(function (o) {
    if (o.value === value) listed = true;
    add(o.value, o.label);
  });
  if (value && !listed) add(value, value + '（選択肢に無い値）');
}

function writeForm(card, status) {
  document.getElementById('f-title').value = (card && card.title) || '';
  document.getElementById('f-description').value = (card && card.description) || '';
  document.getElementById('f-acceptance').value = (card && card.acceptance_criteria) || '';
  document.getElementById('f-status').value = status || STATUS_OPTIONS[0];
  document.getElementById('f-priority').value = (card && card.priority) || 'Medium';
  document.getElementById('f-size').value = (card && card.size) || '';
  // 選択肢の value は trim 済み（CSV 側は前後の空白を落とさない）。ここで揃えないと
  // ' sprint001 ' のような値が選択肢に一致せず、パネル上だけ「（未割り当て）」に化ける
  // （ロードマップは normalizeSprint で trim するので、画面によって違って見える）。
  var sprint = String((card && card.sprint) || '').trim();
  fillSprintSelect(sprint);
  document.getElementById('f-sprint').value = sprint;
}

/** id が null なら新規作成。presetStatus は新規作成時の初期ステータス。 */
function openPanel(id, presetStatus) {
  var card = id ? findCard(board, id) : null;
  if (id && !card) return;
  var status = id ? columnStatusOf(board, id) : (presetStatus || STATUS_OPTIONS[0]);
  panelSeq++;
  panelState = { id: id, expectedUpdatedAt: card ? card.updated_at : '', status: status, fields: null };
  document.getElementById('panel-title').textContent = id ? id : '新しい PBI';
  document.getElementById('panel-delete').hidden = !id;
  writeForm(card, status);
  // 差分送信の基準。card ではなくフォームから読む。select は語彙外の値を
  // 受け付けないため、card の値とフォームの表示は一致しないことがある。
  panelState.fields = readForm();
  setPanelMessage('', 'info');
  setPanelBusy(false);
  document.getElementById('panel').hidden = false;
  render(board);   // 選択中のカードに印を付ける
  document.getElementById('f-title').focus();
}

function closePanel() {
  document.getElementById('panel').hidden = true;
  panelSeq++;   // 閉じたあとに応答が来ても、そのパネルは既に無い
  panelState = { id: null, expectedUpdatedAt: '', status: STATUS_OPTIONS[0], fields: null };
  render(board);
}

// 送信中もフォームの入力欄が編集できてしまうと、応答が成功したときに
// closePanel() で書きかけの編集が黙って消える。ボタンだけでなく入力欄も
// 塞いで、送信した内容と画面の内容がずれたまま先へ進めないようにする。
var PANEL_FORM_FIELD_IDS = ['f-title', 'f-description', 'f-acceptance', 'f-status', 'f-priority', 'f-size', 'f-sprint'];

function setPanelBusy(busy) {
  document.getElementById('panel-save').disabled = busy;
  document.getElementById('panel-delete').disabled = busy;
  PANEL_FORM_FIELD_IDS.forEach(function (id) { document.getElementById(id).disabled = busy; });
}

/**
 * 競合のあと、パネルが次に送る updated_at を描き直した board へ合わせる。
 *
 * panelState.expectedUpdatedAt は openPanel でしか更新されないため、これが無いと
 * 同じ古い値を送り続け、何度押しても conflict になってパネルから抜け出せない
 * （脱出路は「閉じて開き直す」＝書きかけが消える、だけになる）。ドラッグは
 * move() が毎回その時点の updated_at を読み直すので、この罠はパネルだけにある。
 */
function syncPanelExpectedUpdatedAt(id) {
  var latest = findCard(board, id);
  if (latest) panelState.expectedUpdatedAt = latest.updated_at;
}

/** 保存する。panelState.id が null なら新規作成。 */
function savePanel() {
  var id = panelState.id;
  var seq = panelSeq;   // このパネルが今も同じものかを応答時に見分ける通し番号
  // 作成は列の文脈（status）を含む全項目を送る。差分の基準になる既存行が無い。
  var fields = id ? changedFields(panelState.fields) : readForm();
  setPanelBusy(true);
  setPanelMessage(id ? '保存しています…' : '作成しています…', 'info');
  var trustWholeBoard = null;

  // 作成にはまだ id が無い。pendingIds は「送信中の会計」と「実在カードの表示・
  // 操作抑止」を兼ねているため、合成キーで会計側だけに載せる（renderCard は実在 id
  // としか照合しないので、このキーが表示に出ることはない）。
  var pendKey = id ? id : '(new)' + seq;
  pendingIds[pendKey] = true;
  inflight++;
  if (inflight > 1) overlapped = true;
  render(board);   // 送信中のカードに pending の印を付ける（move() と対称にする）

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      delete pendingIds[pendKey];
      inflight--;
      trustWholeBoard = settleOverlap();
      // 応答が返るまでに別のパネルを開いている場合がある。board の反映は必ず行い、
      // パネルに触る操作だけを「まだ同じ要求を出したパネルを開いているとき」に限る。
      var mine = (seq === panelSeq);
      if (mine) setPanelBusy(false);
      if (res.ok) {
        writeSeq++;   // loadView() が発行後の書き込みを見分けるための会計
        var newId = id || res.id;
        render(trustWholeBoard ? res.board : mergeOneCard(board, res.board, newId));
        if (mine) closePanel();
        setMessage((id ? id + ' を保存しました。' : res.id + ' を作成しました。'), 'info');
      } else {
        // 検証エラーではパネルを閉じない。閉じると入力が消える。
        if (res.board) {
          if (id) render(trustWholeBoard ? res.board : mergeOneCard(board, res.board, id));
          // 作成失敗はまだ id が無く、1枚だけ取り込む先が無いので、重なっている
          // ときは board に触らない（他の送信中の反映を巻き戻さないため）。
          else if (trustWholeBoard) render(res.board);
        }
        // 競合だけは基準を進める。検証エラー等で進めると、次の保存が他の人の
        // 変更を一度も見せないまま黙って上書きしてしまう。
        if (mine && id && res.reason === 'conflict') syncPanelExpectedUpdatedAt(id);
        // 別のパネルを開いていると、パネルに出しても本人には届かない。
        if (mine) setPanelMessage(res.message, 'error');
        else setMessage((id || '新規作成') + ': ' + res.message, 'error');
      }
    })
    .withFailureHandler(function (err) {
      delete pendingIds[pendKey];
      inflight--;
      settleOverlap();
      render(board);
      var mine = (seq === panelSeq);
      var verb = id ? '保存' : '作成';
      if (mine) {
        setPanelBusy(false);
        setPanelMessage(verb + 'に失敗しました: ' + err.message, 'error');
      } else {
        setMessage((id || '新規作成') + ': ' + verb + 'に失敗しました: ' + err.message, 'error');
      }
    });

  if (id) runner.apiUpdatePbi(id, fields, panelState.expectedUpdatedAt);
  else runner.apiCreatePbi(fields);
}

var toastTimer = null;
var UNDO_SECONDS = 10;
// 表示中の通知の文面。通知は1件しか出せないため、その最中に次の通知（次の削除）が
// 来たら前の取り消しはもう押せなくなる。黙って失うのではなく、上書きする前に
// 全体メッセージで知らせる。
var activeToastText = null;

/** 取り消せる通知を出す。時間が過ぎたら消える。 */
function showUndoToast(text, onUndo) {
  if (toastTimer && activeToastText) {
    setMessage(activeToastText + '（この削除はもう取り消せません）', 'info');
  }
  var el = document.getElementById('toast');
  document.getElementById('toast-text').textContent = text;
  var btn = document.getElementById('toast-undo');
  btn.onclick = function () { hideToast(); onUndo(); };
  el.hidden = false;
  activeToastText = text;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, UNDO_SECONDS * 1000);
}

function hideToast() {
  if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
  document.getElementById('toast').hidden = true;
  document.getElementById('toast-undo').onclick = null;   // 期限切れ後は押せないようにする
  activeToastText = null;
}

/**
 * 削除する。確認は挟まず、取り消せる通知を出す（モーダルは操作を制限するため使わない）。
 * 押した瞬間にカードを消し、失敗したら戻す。savePanel() と同じ作りにする:
 * board の反映は必ず行い、パネルに触る操作だけを「まだ同じパネルを開いているとき」に限る。
 */
function deletePbi() {
  var id = panelState.id;
  if (!id) return;
  var seq = panelSeq;   // このパネルが今も同じものかを応答時に見分ける通し番号
  var title = document.getElementById('f-title').value;
  var expectedUpdatedAt = panelState.expectedUpdatedAt;
  // 失敗したときにこの1枚だけを元へ戻すため、消す前の位置を控えておく。
  var originalCard = findCard(board, id);
  var originalStatus = columnStatusOf(board, id);

  setPanelBusy(true);
  pendingIds[id] = true;
  inflight++;
  if (inflight > 1) overlapped = true;
  render(boardWithCardRemoved(board, id));   // 楽観的に消す

  google.script.run
    .withSuccessHandler(function (res) {
      delete pendingIds[id];
      inflight--;
      var trustWholeBoard = settleOverlap();
      var mine = (seq === panelSeq);
      if (mine) setPanelBusy(false);
      if (res.ok) {
        writeSeq++;   // loadView() が発行後の書き込みを見分けるための会計
        render(trustWholeBoard ? res.board : mergeOneCard(board, res.board, id));
        if (mine) closePanel();
        showUndoToast(id + '「' + title + '」を削除しました。', function () { restorePbi(res.removed); });
      } else {
        if (res.board) render(trustWholeBoard ? res.board : mergeOneCard(board, res.board, id));
        // パネルを開いたままの間にこのカードが board から消えていることがある
        // （別の応答が先に処理した等）。その場合 originalCard は null になるので、
        // 存在しないカードを元に戻そうとして例外にしない。
        else if (originalCard) render(boardWithCardUpserted(board, originalCard, originalStatus));
        else render(board);
        // 保存と同じく、競合のあとは基準を進めないと二度と削除できない。
        if (mine && res.reason === 'conflict') syncPanelExpectedUpdatedAt(id);
        // 別のパネルを開いていると、パネルに出しても本人には届かない。
        if (mine) setPanelMessage(res.message, 'error');
        else setMessage(id + ': ' + res.message, 'error');
      }
    })
    .withFailureHandler(function (err) {
      delete pendingIds[id];
      inflight--;
      settleOverlap();
      if (originalCard) render(boardWithCardUpserted(board, originalCard, originalStatus));
      else render(board);
      var mine = (seq === panelSeq);
      if (mine) {
        setPanelBusy(false);
        setPanelMessage('削除に失敗しました: ' + err.message, 'error');
      } else {
        setMessage(id + ': 削除に失敗しました: ' + err.message, 'error');
      }
    })
    .apiDeletePbi(id, expectedUpdatedAt);
}

/** 削除を取り消す。元の ID と作成日を保ったまま戻す（apiCreatePbi は使わない）。 */
function restorePbi(row) {
  if (!row) { setMessage('取り消せませんでした。最新にしてから確認してください。', 'error'); return; }
  setMessage(row.id + ' を戻しています…', 'info');
  // pendingIds は実在カードの表示・操作抑止にも使われる。素の id で載せると、
  // 送信中に loadView() で board へ戻ってきた同じ id のカードが送信中扱いになり、
  // 開くこともドラッグもできなくなる。合成キーで衝突を避ける
  // （作成の (new) キーと同じく、会計側だけに載せるためのもの）。
  var pendKey = '(undo)' + row.id;
  pendingIds[pendKey] = true;
  inflight++;
  if (inflight > 1) overlapped = true;

  google.script.run
    .withSuccessHandler(function (res) {
      delete pendingIds[pendKey];
      inflight--;
      var trustWholeBoard = settleOverlap();
      if (res.ok) {
        writeSeq++;   // loadView() が発行後の書き込みを見分けるための会計
        render(trustWholeBoard ? res.board : mergeOneCard(board, res.board, row.id));
        setMessage(row.id + ' を戻しました。', 'info');
      } else {
        if (res.board) render(trustWholeBoard ? res.board : mergeOneCard(board, res.board, row.id));
        setMessage(res.message, 'error');
      }
    })
    .withFailureHandler(function (err) {
      delete pendingIds[pendKey];
      inflight--;
      settleOverlap();
      setMessage('取り消せませんでした: ' + err.message, 'error');
    })
    .apiRestorePbi(row);
}

function renderTabs() {
  var tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  TABS.forEach(function (t) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = t.label;
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', t.id === activeTab ? 'true' : 'false');
    b.addEventListener('click', function () { switchTab(t.id); });
    tabs.appendChild(b);
  });

  var views = document.getElementById('views');
  views.innerHTML = '';
  var tab = TABS.filter(function (t) { return t.id === activeTab; })[0];
  var single = !tab || tab.views.length <= 1;
  // ビューが1つだけのタブでは切り替えを出さない（押せる先が無いものを見せない）。
  // ボタンを作らないだけでは #views の margin が隙間として残るため、hidden も立てる。
  views.hidden = single;
  if (single) return;
  tab.views.forEach(function (v) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = v.label;
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', v.id === activeView ? 'true' : 'false');
    b.addEventListener('click', function () { switchView(v.id); });
    views.appendChild(b);
  });
}

function switchTab(tabId) {
  // 選択中のタブをもう一度押しても、今のビューがそのタブに属しているなら変えない
  // （views[0] に戻すと、ベロシティを見ている最中にバーンダウンへ飛んでしまう）。
  if (tabId === activeTab) return;
  var tab = TABS.filter(function (t) { return t.id === tabId; })[0];
  if (!tab) return;
  activeTab = tabId;
  activeView = tab.views[0].id;
  closePanel();
  renderTabs();
  showView(activeView);
  loadView();
}

function switchView(viewId) {
  activeView = viewId;
  closePanel();
  renderTabs();
  showView(activeView);
  loadView();
}

function currentView() { return activeView; }

/**
 * 「どのビューを見せるか」をクリック時点で確定させる。応答を待たない。
 *
 * hidden の切替と要約のクリアを応答任せにすると、読み取りが失敗する・遅延するたびに
 * 選んだタブと違う（前のタブの、操作可能な）盤面や表が残る。表側は前のビューの中身を
 * そのまま残さないよう、応答が届くまで「読み込んでいます…」に置き換える
 * （盤面側は元から1種類の描画先しか無く、他のビューの中身と混ざらないため置き換えない）。
 */
function showView(viewId) {
  var isBoard = viewId === 'board';
  document.getElementById('board').hidden = !isBoard;
  document.getElementById('table-view').hidden = isBoard;
  renderSummary(null);   // 新しい要約は応答で入るまでクリアしておく
  if (!isBoard) showTableLoading();
}

/** #table-view を「読み込み中」の状態にする。前のビューの表を残したまま応答を待たない。 */
function showTableLoading() {
  var host = document.getElementById('table-view');
  clearHost(host);
  var loading = document.createElement('div');
  loading.className = 'table-empty';
  loading.textContent = '読み込んでいます…';
  host.appendChild(loading);
  tableLoading = true;
}

/**
 * 「読み込んでいます…」を畳む。エラー文言は #message に出るため、ここでは空にする
 * だけでよい。判定は tableLoading（今そこに placeholder が出ているか）で行う —
 * 「捨てるべき応答か」では判定しない。renderTable() が実データの表を描いた後
 * （tableLoading === false）に畳むと、「最新にする」（showView() を経由しないので
 * placeholder が立ち直らない）が失敗したときに描画済みの表を消してしまう。
 * viewSeq が不一致（別のビューへ切り替え済み）のときに畳まれないのは、その時点で
 * 新しい showTableLoading() が placeholder を立て直しているから（tableLoading は
 * 新しい読み込みのものに置き換わっている）で、ここでは意識して判定していない。
 */
function foldTableLoading() {
  if (!tableLoading) return;
  clearHost(document.getElementById('table-view'));
  tableLoading = false;
}

/** 要約を描く。summary の形はタブごとに違う（無ければ何も出さない）。 */
function renderSummary(summary) {
  var host = document.getElementById('summary');
  clearHost(host);
  if (!summary) return;

  function stat(label, value) {
    var span = document.createElement('span');
    span.textContent = label + ': ' + value;
    host.appendChild(span);
  }

  /**
   * スプリントゴールを1行で出す。stat() の並びには埋めない — 数値の統計と同じ
   * 見た目にすると文章が読み飛ばされる。値はユーザー由来なので textContent で入れる。
   */
  function goalLine(text) {
    var span = document.createElement('span');
    span.className = 'goal';
    var label = document.createElement('b');
    label.textContent = 'ゴール: ';
    span.appendChild(label);
    var body = document.createElement('span');
    body.textContent = text;
    span.appendChild(body);
    host.appendChild(span);
  }

  // 分岐は実際に読むプロパティ（total / sprint / open）でガードする。summary.byStatus は
  // 空配列でも truthy になるため、それで分岐すると読む先（total）と食い違いうる。
  if (summary.total !== undefined) {
    // やること: 合計件数・ポイント。
    stat('合計', summary.total.count + '件 / ' + summary.total.points + 'pt');
  } else if (summary.sprint !== undefined) {
    // スプリント: ゴールと、直近スプリントの計画/完了/持ち越し。
    // ゴールはそのスプリントが在る理由そのものなので先に出す。sprint_backlog.md に
    // ゴール節が無い・読めないときは空文字で届くため、その行自体を出さない
    // （「ゴール: 」だけが出るのを避ける）。
    if (summary.goal) goalLine(summary.goal);
    stat('スプリント', summary.sprint);
    stat('計画', summary.planned + 'pt');
    stat('完了', summary.completed + 'pt');
    stat('持ち越し', summary.carriedOver + 'pt');
  } else if (summary.open !== undefined) {
    // 障害物: 未解決/解決済の件数。
    stat('未解決', summary.open + '件');
    stat('解決済', summary.resolved + '件');
  }
}

function loadView() {
  // apiGetView はロックを取らないため、書き込み中の古い CSV を読める。応答が届くまでの
  // 間に何か1件でも書き込みが確定していれば、この board（表のビューも同様）はもう古い。
  // inflight（応答時点で送信中の要求が無いか）だけでは、発行後に確定して既に終わった
  // 書き込みを見分けられない。盤面だけでなく表のビューでも同じ扱いにする。
  var seenSeq = writeSeq;
  var requestedView = activeView;
  viewSeq++;
  var seq = viewSeq;   // この読み込みが今も最新かを応答時に見分ける通し番号（panelSeq と同型）
  setMessage('読み込んでいます…', 'info');
  google.script.run
    .withSuccessHandler(function (res) {
      // 「今も選ばれているビューの、一番新しい読み込みか」を最初に見る。同じビューへの
      // 読み直しが逆順に届く場合も含めて、これより後に発行された読み込みがあれば捨てる。
      // writeSeq の判定より先に置かないと、既に描き終えた別ビューの上に、見てもいない
      // 遠いビューのエラー文言が被さる。
      if (seq !== viewSeq) return;
      if (res.ok) {
        if (writeSeq !== seenSeq) {
          // 描かずに黙って終わると、何も起きなかったように見えるのが一番悪い。
          // ここも失敗の確定と同じく、placeholder が出ていれば畳む
          // （tableLoading が false なら foldTableLoading() は何もしない）。
          foldTableLoading();
          setMessage('読み込み中に他の変更が入りました。もう一度お試しください。', 'error');
          return;
        }
        // スプリントの選択肢。盤面の応答だけが運ぶため、載っているときだけ入れ替える
        // （載っていない応答で空にすると、次に開くパネルが選択肢を失う）。
        if (res.sprintChoices) sprintChoices = res.sprintChoices;
        // hidden の切替と要約のクリアは showView() が発行前（クリック時点）に済ませている。
        // ここでは中身を描くだけにする（応答任せにすると、失敗・遅延のたびに前のタブの
        // 操作可能な盤面や表が残ってしまう）。
        if (requestedView === 'board') { render(res.view); } else { renderTable(res.view); }
        renderSummary(res.summary);
        setMessage('', 'info');
      } else {
        // 失敗が確定した（＝捨てるべき応答ではない）。placeholder が出ていれば畳む。
        foldTableLoading();
        setMessage(res.message, 'error');
      }
    })
    .withFailureHandler(function (err) {
      if (seq !== viewSeq) return;
      foldTableLoading();
      setMessage('読み込みに失敗しました: ' + err.message, 'error');
    })
    .apiGetView(requestedView);
}

/** 「ありません。」を表示する要素を作る。行が0件の表はヘッダーだけ出さない。 */
function emptyTableRow(text) {
  var div = document.createElement('div');
  div.className = 'table-empty';
  div.textContent = text;
  return div;
}

/** ヘッダー行を作る。列の見出しが用語集にあれば補足を添える。 */
function tableHead(labels) {
  var thead = document.createElement('thead');
  var tr = document.createElement('tr');
  labels.forEach(function (label) {
    var th = document.createElement('th');
    th.textContent = label;
    appendHelp(th, label);
    tr.appendChild(th);
  });
  thead.appendChild(tr);
  return thead;
}

/**
 * headers（文字列配列）と rows（セル値の配列の配列）から表を作る。
 * バーンダウン/ベロシティ/ロードマップ用。marks（省略可）はロードマップの帯を塗る
 * セル位置 [{row, col}]（row は rows の添字、col は行内セルの添字。ヘッダー行は含まない）。
 * 範囲外や欠落があっても例外にはせず、単にどこも塗らない。
 */
function gridTable(headers, rows, marks) {
  if (!rows || rows.length === 0) return emptyTableRow('ありません。');
  // 毎セル marks を線形探索すると行数×列数×件数になるため、先にキー集合を作る。
  var markKeys = {};
  (marks || []).forEach(function (m) { markKeys[m.row + ':' + m.col] = true; });
  var table = document.createElement('table');
  table.appendChild(tableHead(headers));
  var tbody = document.createElement('tbody');
  rows.forEach(function (row, ri) {
    var tr = document.createElement('tr');
    row.forEach(function (cell, ci) {
      var td = document.createElement('td');
      td.textContent = (cell === null || cell === undefined) ? '' : String(cell);
      if (markKeys[ri + ':' + ci]) td.classList.add('mark');
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

/** columns（{field,label}の配列）と rows（オブジェクトの配列）から表を作る。一覧/完了/障害物用。 */
function objectTable(columns, rows) {
  if (!rows || rows.length === 0) return emptyTableRow('ありません。');
  var table = document.createElement('table');
  table.appendChild(tableHead(columns.map(function (c) { return c.label; })));
  var tbody = document.createElement('tbody');
  rows.forEach(function (row) {
    var tr = document.createElement('tr');
    columns.forEach(function (c) {
      var td = document.createElement('td');
      var v = row[c.field];
      td.textContent = (v === null || v === undefined) ? '' : String(v);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

/** 見出し付きの表。障害物の未解決/解決済のように、同じ列定義の表を複数並べるときに使う。 */
function tableSection(title, columns, rows) {
  var section = document.createElement('div');
  var h = document.createElement('h3');
  h.textContent = title;
  section.appendChild(h);
  section.appendChild(objectTable(columns, rows));
  return section;
}

/** 表を描く。ユーザー由来の文字列は textContent で入れる。 */
function renderTable(view) {
  var host = document.getElementById('table-view');
  tableLoading = false;   // 実データを描くので、もう「読み込み中」ではない
  clearHost(host);
  if (!view) {
    var none = document.createElement('div');
    none.className = 'table-empty';
    none.textContent = 'まだありません。';
    host.appendChild(none);
    return;
  }
  // 障害物は未解決と解決済の2つの表になる。
  if (view.open !== undefined && view.resolved !== undefined) {
    host.appendChild(tableSection('未解決', view.columns, view.open));
    host.appendChild(tableSection('解決済', view.columns, view.resolved));
    return;
  }
  if (view.table) {
    host.appendChild(gridTable(view.table.headers, view.table.rows, view.marks));
    return;
  }
  host.appendChild(objectTable(view.columns, view.rows));
}

/**
 * 楽観的更新: ドロップした瞬間にカードを新しい列へ動かして描き直し、
 * サーバの応答を待たずに見た目を反映する。応答が来たら、
 * 成功時はサーバが返した board、失敗時は元の位置（競合時はサーバが返す
 * 最新の board）で描き直す。
 */
function move(id, newStatus) {
  // 盤面タブを見ていないのにドラッグを送らせない。#board は hidden 属性で隠れていても
  // DOM からは消えていない（要素は残ったまま）ため、この防御が無いと、別タブへ切り替えた
  // あとに残っている盤面をドラッグして書き込みが飛んでしまう。
  if (activeView !== 'board') return;
  var card = findCard(board, id);
  if (!card) return;
  var expectedUpdatedAt = card.updated_at;
  // 戻すときはドラッグ時点の board 全体ではなく「このカードを元の列へ返す」操作にする。
  // 全体を復元すると、並行して送信中の別カードの移動まで巻き戻したり、
  // 取り消したはずの移動を復活させたりする。
  var originalStatus = columnStatusOf(board, id);

  pendingIds[id] = true;
  inflight++;
  if (inflight > 1) overlapped = true;
  render(boardWithCardMoved(board, id, newStatus));
  setMessage(id + ' を ' + newStatus + ' に移しています…', 'info');

  google.script.run
    .withSuccessHandler(function (res) {
      delete pendingIds[id];
      inflight--;
      var trustWholeBoard = settleOverlap();
      if (res.ok) {
        writeSeq++;   // loadView() が発行後の書き込みを見分けるための会計
        render(applyServerBoard(res.board, id, trustWholeBoard));
        setMessage(id + ' を ' + newStatus + ' に移しました。', 'info');
      } else {
        // res.board があれば競合等でサーバが返した最新の内容、無ければ
        // 今の画面からこのカードだけを元の列へ戻す。
        render(res.board
          ? applyServerBoard(res.board, id, trustWholeBoard)
          : rollbackCard(id, newStatus, originalStatus));
        setMessage(res.message, 'error');
      }
    })
    .withFailureHandler(function (err) {
      delete pendingIds[id];
      inflight--;
      settleOverlap();
      render(rollbackCard(id, newStatus, originalStatus));
      setMessage('更新に失敗しました: ' + err.message, 'error');
    })
    .apiUpdateStatus(id, newStatus, expectedUpdatedAt);
}

document.getElementById('reload').addEventListener('click', loadView);
fillButton(document.getElementById('reload'), 'reload', '最新にする');
fillSelect(document.getElementById('f-status'), STATUS_OPTIONS);
fillSelect(document.getElementById('f-priority'), PRIORITY_OPTIONS);
// パネルの入力欄は補足を押させず、常に見せる。文面は用語集を源泉にする。
document.getElementById('f-acceptance-hint').textContent = glossaryOf('受入基準');
document.getElementById('f-size-hint').textContent = glossaryOf('ポイント');
// 補足の本文は position: fixed で、開いた時点の ? の位置に置く。画面が動くと位置が
// ずれたまま残るので閉じる。スクロールは要素からは上がってこない（bubble しない）ため、
// 捕捉フェーズで受ける（表は #table-view の中でスクロールする）。
window.addEventListener('scroll', function () { closeOpenHelp(); }, true);
window.addEventListener('resize', function () { closeOpenHelp(); });
document.getElementById('panel-close').appendChild(makeIcon('close'));
fillButton(document.getElementById('panel-save'), 'save', '保存');
fillButton(document.getElementById('panel-delete'), 'trash', '削除');
document.getElementById('panel-close').addEventListener('click', closePanel);
document.getElementById('panel-save').addEventListener('click', savePanel);
fillButton(document.getElementById('toast-undo'), 'undo', '取り消す');
document.getElementById('panel-delete').addEventListener('click', deletePbi);
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Escape') return;
  // 一番手前にあるものから閉じる。補足は通知（z-index: 10）より上（20）に出る。
  if (closeOpenHelp()) return;
  if (!document.getElementById('toast').hidden) { hideToast(); return; }
  if (!document.getElementById('panel').hidden) closePanel();
});
renderTabs();
showView(activeView);
loadView();
</script>
