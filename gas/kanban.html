<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --line: #dadce0; --ink: #202124; --ink-2: #5f6368;
    --accent: #1a73e8; --bg: #f8f9fa; --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
    font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0; }
  button {
    font: inherit; padding: 6px 12px; border: 1px solid var(--line);
    background: var(--card); border-radius: 4px; cursor: pointer;
  }
  button:hover { background: var(--bg); }
  #message { min-height: 20px; margin-bottom: 12px; font-size: 13px; }
  #message.error { color: #c5221f; }
  #message.info { color: var(--ink-2); }
  #board { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; }
  .column {
    flex: 1 0 200px; background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px; min-height: 120px;
  }
  .column.over { border-color: var(--accent); background: #e8f0fe; }
  .column h2 { font-size: 13px; margin: 0 0 8px; color: var(--ink-2); }
  .count { font-weight: normal; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px; margin-bottom: 8px; cursor: grab; font-size: 13px;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; }
  .card.pending { opacity: 0.6; cursor: default; }
  .card .id { color: var(--ink-2); font-size: 11px; }
  .card .title { margin: 2px 0 4px; }
  .card .meta { color: var(--ink-2); font-size: 11px; }
  .empty { color: var(--ink-2); font-size: 12px; padding: 8px 0; }
</style>
</head>
<body>
<header>
  <h1>AI Scrum ボード</h1>
  <button id="reload" type="button">最新にする</button>
</header>
<div id="message" class="info">読み込んでいます…</div>
<div id="board"></div>

<script>
var dragging = null;
// 現在描画している board。楽観的更新の基準（元の位置へ戻す先）として保持する。
var board = null;
// サーバへ送信中のカード id。応答が返るまで再ドラッグさせない。
var pendingIds = {};

function setMessage(text, kind) {
  var el = document.getElementById('message');
  el.textContent = text;
  el.className = kind || 'info';
}

function render(b) {
  board = b;
  var root = document.getElementById('board');
  root.innerHTML = '';
  b.columns.forEach(function (col) {
    var div = document.createElement('div');
    div.className = 'column';
    div.dataset.status = col.status;

    var h = document.createElement('h2');
    h.textContent = col.status + ' ';
    var c = document.createElement('span');
    c.className = 'count';
    c.textContent = '(' + col.cards.length + ')';
    h.appendChild(c);
    div.appendChild(h);

    if (col.cards.length === 0) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'なし';
      div.appendChild(e);
    }

    col.cards.forEach(function (card) { div.appendChild(renderCard(card)); });

    div.addEventListener('dragover', function (ev) {
      ev.preventDefault();
      div.classList.add('over');
    });
    div.addEventListener('dragleave', function () { div.classList.remove('over'); });
    div.addEventListener('drop', function (ev) {
      ev.preventDefault();
      div.classList.remove('over');
      if (dragging && dragging.status !== col.status && !pendingIds[dragging.id]) {
        move(dragging.id, col.status);
      }
    });

    root.appendChild(div);
  });
}

function renderCard(card) {
  var el = document.createElement('div');
  el.className = 'card' + (pendingIds[card.id] ? ' pending' : '');
  el.draggable = !pendingIds[card.id];

  var id = document.createElement('div');
  id.className = 'id';
  id.textContent = card.id;
  el.appendChild(id);

  var t = document.createElement('div');
  t.className = 'title';
  t.textContent = card.title;
  el.appendChild(t);

  var m = document.createElement('div');
  m.className = 'meta';
  var parts = [];
  if (card.priority) parts.push(card.priority);
  if (card.size) parts.push(card.size + ' pt');
  if (card.sprint) parts.push(card.sprint);
  m.textContent = parts.join(' · ');
  el.appendChild(m);

  el.addEventListener('dragstart', function (ev) {
    if (pendingIds[card.id]) { ev.preventDefault(); return; }
    dragging = {
      id: card.id,
      status: el.parentNode.dataset.status,
      updatedAt: card.updated_at
    };
    // Firefox は dragstart で dataTransfer にデータをセットしないと
    // ドラッグ操作自体を開始しない（Chrome / Edge / Safari は不要でも動く）。
    // 実際の値は dragging（クロージャ）で保持するため、ここでは形式的にセットするだけでよい。
    ev.dataTransfer.setData('text/plain', card.id);
    el.classList.add('dragging');
  });
  el.addEventListener('dragend', function () {
    dragging = null;
    el.classList.remove('dragging');
  });
  return el;
}

/** board の中から id のカードを探す。見つからなければ null。 */
function findCard(b, id) {
  for (var i = 0; i < b.columns.length; i++) {
    var cards = b.columns[i].cards;
    for (var j = 0; j < cards.length; j++) {
      if (cards[j].id === id) return cards[j];
    }
  }
  return null;
}

/** id のカードが今どの列にいるかを返す。見つからなければ null。 */
function columnStatusOf(b, id) {
  for (var i = 0; i < b.columns.length; i++) {
    var cards = b.columns[i].cards;
    for (var j = 0; j < cards.length; j++) {
      if (cards[j].id === id) return b.columns[i].status;
    }
  }
  return null;
}

/** board を複製し、id のカードを newStatus の列へ移した新しい board を返す（元の board は変えない）。 */
function boardWithCardMoved(b, id, newStatus) {
  var next = { columns: b.columns.map(function (col) { return { status: col.status, cards: col.cards.slice() }; }) };
  var moving = null;
  for (var i = 0; i < next.columns.length; i++) {
    var cards = next.columns[i].cards;
    for (var j = 0; j < cards.length; j++) {
      if (cards[j].id === id) { moving = cards[j]; cards.splice(j, 1); break; }
    }
    if (moving) break;
  }
  if (!moving) return next;
  for (var k = 0; k < next.columns.length; k++) {
    if (next.columns[k].status === newStatus) { next.columns[k].cards.push(moving); break; }
  }
  return next;
}

function load() {
  setMessage('読み込んでいます…', 'info');
  google.script.run
    .withSuccessHandler(function (res) {
      if (res.ok) { render(res.board); setMessage('', 'info'); }
      else { setMessage(res.message, 'error'); }
    })
    .withFailureHandler(function (err) { setMessage('読み込みに失敗しました: ' + err.message, 'error'); })
    .apiGetBoard();
}

/**
 * 楽観的更新: ドロップした瞬間にカードを新しい列へ動かして描き直し、
 * サーバの応答を待たずに見た目を反映する。応答が来たら、
 * 成功時はサーバが返した board、失敗時は元の位置（競合時はサーバが返す
 * 最新の board）で描き直す。
 */
function move(id, newStatus) {
  var card = findCard(board, id);
  if (!card) return;
  var expectedUpdatedAt = card.updated_at;
  // 戻すときはドラッグ時点の board 全体ではなく「このカードを元の列へ返す」操作にする。
  // 全体を復元すると、並行して送信中の別カードの移動まで巻き戻したり、
  // 取り消したはずの移動を復活させたりする。
  var originalStatus = columnStatusOf(board, id);

  pendingIds[id] = true;
  render(boardWithCardMoved(board, id, newStatus));
  setMessage(id + ' を ' + newStatus + ' に移しています…', 'info');

  google.script.run
    .withSuccessHandler(function (res) {
      delete pendingIds[id];
      if (res.ok) {
        render(res.board);
        setMessage(id + ' を ' + newStatus + ' に移しました。', 'info');
      } else {
        // res.board があれば競合等でサーバが返した最新の内容、無ければ
        // 今の画面からこのカードだけを元の列へ戻す。
        render(res.board || boardWithCardMoved(board, id, originalStatus));
        setMessage(res.message, 'error');
      }
    })
    .withFailureHandler(function (err) {
      delete pendingIds[id];
      render(boardWithCardMoved(board, id, originalStatus));
      setMessage('更新に失敗しました: ' + err.message, 'error');
    })
    .apiUpdateStatus(id, newStatus, expectedUpdatedAt);
}

document.getElementById('reload').addEventListener('click', load);
load();
</script>
</body>
</html>
